name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests
      - run: uv run mypy
      - run: uv run pytest -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      # The simulator-only autopilot SignalK plugin; no dependencies, so no install.
      - name: signalk-plugin tests
        run: npm test
        working-directory: signalk-plugin
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: uv build --wheel
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t yey-boats-simulator:ci .
      - name: run a few ticks via stdout sink and verify steady state
        run: |
          set -eu
          cid=$(docker run -d --entrypoint yey-boats-sim \
            -e DATA_DIR=/tmp yey-boats-simulator:ci \
            --sink stdout --no-failover)
          sleep 45
          echo "--- container logs ---"
          docker logs "$cid" || true

          running=$(docker inspect -f '{{.State.Running}}' "$cid")
          if [ "$running" != "true" ]; then
            echo "::error::container is not running after 45s (crashed/exited)"
            docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' "$cid"
            docker rm -f "$cid" >/dev/null 2>&1 || true
            exit 1
          fi

          # "[sink] active: <name>" is printed once SinkChain.open() succeeds
          # (adapters/failover.py) — the steady-state marker for this smoke test.
          if ! docker logs "$cid" 2>&1 | grep -q '\[sink\] active:'; then
            echo "::error::container never reached steady state ([sink] active: marker not seen in logs)"
            docker rm -f "$cid" >/dev/null 2>&1 || true
            exit 1
          fi

          echo "container is running and reached steady state"
          docker rm -f "$cid"

  # Publish a multi-arch image to GHCR on every green push to main, so the lab
  # deployment can pull a fresh build (ghcr.io/yey-boats/simulator:latest|main|sha-<short>).
  # Versioned releases are still cut by release.yml on v* tags.
  publish-image:
    needs: [test, docker-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,format=short
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
