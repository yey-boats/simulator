# Tag-triggered release. Push a tag v<version> (matching pyproject.toml) and this
# publishes the image to GHCR (and, when enabled, the wheel to PyPI).
# See docs/RELEASING.md for the full flow.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  # Gate: the tag must equal pyproject.toml's version, __version__, the
  # signalk-plugin package.json and a dated CHANGELOG section. Nothing is
  # published from a mismatched tag.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python scripts/check_version.py "${{ github.ref_name }}"
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
  pypi:
    needs: version
    runs-on: ubuntu-latest
    environment: release        # gate: configure secrets/approval before enabling
    permissions:
      contents: read
      id-token: write   # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: frontend
      - run: npm run build       # build the SPA so the wheel/sdist bundle it
        working-directory: frontend
      - run: pip install build && python -m build
      - name: Publish to PyPI (trusted publishing)
        if: ${{ vars.PUBLISH_PYPI == 'true' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
  image:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ghcr.io/yey-boats/simulator:<x.y.z>, :<x.y> and :v<x.y.z>. A release does
      # not move the rolling tag; ci.yml owns it (it tracks main).
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
